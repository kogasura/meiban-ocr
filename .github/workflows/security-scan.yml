name: Security Scan

# 2026-06-02 ポリシー転換: npm publish を廃止し URANUS2 直接配置に切替。
# 本 workflow は以下の 3 層で漏洩を防ぐ:
#
#   1. serial-leak-scan
#      tracked file (code/docs/configs) に E300MM 以外の real-pattern serial が
#      混入していたら fail。 ドキュメント例外は .github/serial-allow.txt で許容。
#
#   2. forbidden-dir-check
#      annotations/, samples/, data/, models/, runs/, videos/, dist-uranus2/ が
#      .gitignore bypass で tracked になっていないか検証。
#
#   3. npm-publish-block-check
#      packages/runtime/package.json に "private": true、 prepublishOnly が
#      exit 1 を返すことを確認。 npm publish 経路を物理ブロック。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serial-leak-scan:
    name: Real-pattern serial leak scan (with allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR の差分も含めて全 commit を見る

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Write per-match scanner script
        # Why: Python heredoc を YAML block scalar に埋め込むと indent 制約で
        # 破綻するため、external file として用意する。
        run: |
          set -euo pipefail
          mkdir -p /tmp/secscan
          cat > /tmp/secscan/extract.py <<'PYEOF'
          import re, sys
          for line in sys.stdin:
              line = line.rstrip()
              serials = re.findall(r"E[39][0-9]{2}MM[0-9]{6}", line)
              if any(not s.startswith("E300MM") for s in serials):
                  print(line)
          PYEOF

      - name: Load allowlist
        run: |
          set -euo pipefail
          ALLOW_FILE=.github/serial-allow.txt
          mkdir -p /tmp/secscan
          if [ -f "$ALLOW_FILE" ]; then
            grep -vE '^\s*(#|$)' "$ALLOW_FILE" > /tmp/secscan/allowlist.txt || true
          else
            : > /tmp/secscan/allowlist.txt
          fi
          echo "Allowlist entries: $(wc -l < /tmp/secscan/allowlist.txt)"

      - name: Scan tracked files for real-pattern Ericsson serials
        run: |
          set -euo pipefail
          echo "Scanning for E[39]\d{2}MM\d{6} matches not in E300MM dummy range..."

          PATTERNS='\.(py|pyi|ts|tsx|js|mjs|cjs|json|yaml|yml|md|toml|html|css|sh|txt)$'

          if [ -s /tmp/secscan/allowlist.txt ]; then
            EXCLUDE_REGEX=$(awk 'NF{printf "^%s$|", $0} END{print "__never__"}' \
              /tmp/secscan/allowlist.txt | sed 's/|$//')
          else
            EXCLUDE_REGEX='__never__'
          fi

          MATCHES=$(
            git ls-files \
              | grep -E "$PATTERNS" \
              | grep -vE "$EXCLUDE_REGEX" \
              | xargs grep -HnE 'E[39][0-9]{2}MM[0-9]{6}' 2>/dev/null \
              | python3 /tmp/secscan/extract.py \
              || true
          )

          if [ -n "$MATCHES" ]; then
            echo "::error::Real-pattern Ericsson serial detected in tracked files:"
            echo "$MATCHES"
            echo ""
            echo "Policy: only 'E300MM\d{6}' is allowed as dummy serial in tracked code/docs."
            echo "If this file is a legitimate documentation example with non-customer data,"
            echo "add its path to .github/serial-allow.txt with a justification comment."
            echo ""
            echo "If the data is private (annotations/, samples/, data/, models/),"
            echo "verify the path is .gitignored and not accidentally git-add'd."
            exit 1
          fi
          echo "OK: no real-pattern serials found in tracked code."

      - name: Scan text_visible fields in tracked annotations for digit leaks
        run: |
          set -euo pipefail
          # 2026-06-02 ポリシー転換以降、 annotations/ は .gitignore 済 → 通常は
          # tracked annotation 自体が存在しない。 万一 tracked になっていた場合の
          # 二重防御として残置。
          if git ls-files annotations/ > /dev/null 2>&1; then
            BAD=$(
              git ls-files annotations/ \
                | xargs grep -HnE '"text_visible"[[:space:]]*:[[:space:]]*"[^"]*[0-9]{5,}' 2>/dev/null \
                || true
            )
            if [ -n "$BAD" ]; then
              echo "::error::text_visible contains 5+ consecutive digits:"
              echo "$BAD"
              echo "Policy: tracked annotation の text_visible にリアル数字は不可。"
              exit 1
            fi
          fi
          echo "OK: no leaky text_visible fields."

  forbidden-dir-check:
    name: Forbidden private dirs not tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify private dirs remain untracked
        run: |
          set -euo pipefail
          # これらは .gitignore で除外されているべき、 万一 `git add -f` 等で
          # tracked になっていたら漏洩経路。
          FORBIDDEN=(
            "annotations/"
            "samples/"
            "data/"
            "models/"
            "runs/"
            "videos/"
            "dist-uranus2/"
          )
          FAIL=0
          for dir in "${FORBIDDEN[@]}"; do
            # .gitkeep / .gitkeep_private のみは許容 (ディレクトリ存在マーカー)
            tracked=$(git ls-files -- "$dir" 2>/dev/null \
              | grep -vE '/(\.gitkeep|\.gitkeep_private)$' || true)
            if [ -n "$tracked" ]; then
              echo "::error::Files inside forbidden private dir '$dir' are tracked:"
              echo "$tracked"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Policy: private dirs must remain .gitignored."
            echo "Run 'git rm --cached <path>' to untrack accidentally committed files."
            exit 1
          fi
          echo "OK: all private dirs remain untracked."

  npm-publish-block-check:
    name: npm publish must remain blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify runtime package.json blocks publish
        run: |
          set -euo pipefail
          node -e "
            const pkg = require('./packages/runtime/package.json');
            const errs = [];
            if (pkg.private !== true) {
              errs.push('packages/runtime/package.json must have \"private\": true');
            }
            if (!pkg.scripts?.prepublishOnly?.includes('exit 1')) {
              errs.push('packages/runtime/package.json prepublishOnly must exit 1');
            }
            if (errs.length) {
              for (const e of errs) console.error('ERROR:', e);
              process.exit(1);
            }
            console.log('OK: private:true + prepublishOnly exit 1 in place');
          "
