# 末尾2nd-pass用 tiny版: 配信サイズ対策 (CRNNPretrained 33MB → MobileNetV3 ~2MB)。
# 末尾4桁@3倍解像度は易タスクなので tiny で足りるかの検証。
data:
  root: data/recognition_tail
  vendor: ericsson
  labels_filename: labels.tsv
  resize_mode: stretch
model:
  num_classes: 37
  rnn_hidden: 128
  rnn_layers: 2
  dropout: 0.1
  arch: tiny

train:
  batch_size: 64
  epochs: 50
  lr_backbone: 0.0001
  lr_head: 0.001
  weight_decay: 0.0001
  num_workers: 4
  freeze_backbone_epochs: 2
  early_stopping_patience: 15
  confidence_threshold: 0.7
runtime:
  device: cuda
  seed: 42
output:
  runs_dir: runs
